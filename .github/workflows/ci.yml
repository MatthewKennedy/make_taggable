---
name: CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - master

jobs:
  sqlite:
    name: sqlite / ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ruby: '3.2', gemfile: rails_7_2}
          - {ruby: '3.2', gemfile: rails_8_0}
          - {ruby: '3.3', gemfile: rails_8_0}
          - {ruby: '3.3', gemfile: rails_8_1}
          - {ruby: '3.4', gemfile: rails_8_1}
          - {ruby: '4.0', gemfile: rails_8_1}
          - {ruby: '4.0', gemfile: rails_main}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      DATABASE_ADAPTER: sqlite3
    continue-on-error: ${{ matrix.gemfile == 'rails_main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  coverage:
    name: coverage / ruby 3.4
    runs-on: ubuntu-latest
    env:
      DATABASE_ADAPTER: sqlite3
      COVERAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # SimpleCov fails the run when coverage drops below the floor set in
      # spec_helper.rb. Raise the floor when coverage improves; never lower it
      # to make a run pass.
      - run: bundle exec rspec

  mysql:
    name: mysql / ruby 3.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: make_taggable_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_ADAPTER: mysql2
      DATABASE_URL: mysql2://root:password@127.0.0.1:3306/make_taggable_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake

  postgres:
    name: postgres / ruby 3.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: make_taggable_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_ADAPTER: postgresql
      DATABASE_URL: postgres://postgres:password@localhost:5432/make_taggable_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake
